# Real agents' browsers (mobile Safari/Chrome especially) accumulate enough
# cookies on agents.innovateonline.com over time to exceed Apache's default
# LimitRequestFieldSize (8190 bytes) -- Apache then rejects the request
# outright with a generic 400 Bad Request before PHP/the app ever runs.
# Confirmed against production logs: real agents submitting
# api/intake_public.php got silently blocked this way, one for over two
# weeks, with no corresponding PHP error-log entry (2026-09-02).
LimitRequestFieldSize 16384
